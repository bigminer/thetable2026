# ------------------------------------------------------------
# Manifest contract
# The WordPress manifest is the input for route classification (DG0-S2) and
# source extraction (DG0-S3). If the snapshot checksum changes, those stories
# must re-fire and downstream artifacts (route-classification.json, etc.)
# are considered stale.
# ------------------------------------------------------------
manifest_contract:
  path: migration-data/source-reference/site-manifest-latest/
  snapshot_checksum: sha1:daa7f7662e4ab7c9a950766af1984d745599868c
  url_count: 243
  recorded_at: 2026-04-18
  regenerate_with: |
    cd /Users/gary/Dev/thetable
    scripts/extract_site_manifest.sh https://thetabletx.com migration-data/site-manifest-latest
    cd /Users/gary/Dev/tablefresh
    rm -rf migration-data/source-reference/site-manifest-latest
    mkdir -p migration-data/source-reference/site-manifest-latest
    cp -R /Users/gary/Dev/thetable/migration-data/site-manifest-latest/. migration-data/source-reference/site-manifest-latest/
  on_change:
    - Re-fire DG0-S2 (route classification)
    - Re-evaluate DG0-S3 field maps against new extraction
    - Flag any downstream artifacts (route-classification.json, content-model-proposal.md, redirect-matrix.yaml) as stale in JOURNAL.md
  verify: scripts/verify/manifest.sh
# ------------------------------------------------------------
# Default per-task budget (override on any task with a `budget:` field).
# See AGENTS.md "Escalation Protocol" for what to do when exceeded.
# ------------------------------------------------------------
budgets_default:
  attempts: 3
  time_hours: 2
# ------------------------------------------------------------
# Execution boundary
# Local-first is the default. A task may prepare hosted configuration, but it
# must not require Cloudflare production deploys, DNS changes, CDN purge,
# or Search Console live validation unless it is explicitly marked
# `requires_hosting: true`. Third-party APIs may be called from local
# development when credentials are available and the operation is read-only
# or otherwise safe for production data.
# ------------------------------------------------------------
execution_boundary:
  default_mode: local_first
  local_first_allows:
    - npm run build
    - npm run preview
    - Playwright tests against local preview
    - content/schema validation against local Markdown
    - route parity checks against local static output or preview
    - fixture-backed Planning Center checks
    - read-only third-party API checks from local development
  hosted_deferred_until_final_launch:
    - Cloudflare Pages production promotion
    - DNS changes for thetabletx.com or thetabletx.org
    - CDN purge
    - Search Console live validation
# ------------------------------------------------------------
# Executor contract
# This plan is optimized for small execution models. Implementation stories
# should be deterministic: inputs, outputs, non-goals, and verify command must
# be explicit. If an executor finds itself choosing architecture, content
# policy, schema shape, provider behavior, or production operations, it should
# stop and create/raise a blocker instead of deciding on the fly.
# ------------------------------------------------------------
executor_contract:
  optimized_for: small_execution_models
  rules:
    - Only execute stories whose blocked_by entries are done.
    - Treat DECISIONS.md and migration-data/*.md as locked inputs.
    - Use the listed source/input files before searching elsewhere.
    - Write only the listed output files unless the story explicitly permits support files.
    - Do not introduce new collections, routes, integrations, or hosted behavior outside the story acceptance.
    - If required data, URLs, schema fields, credentials, or provider behavior are missing, stop and mark the story blocked.
    - Do not mark a story done without a verify script returning exit 0.
  implementation_story_required_fields:
    - mode
    - source or inputs
    - output or outputs
    - verify
    - acceptance
# verify: exit codes (all verify scripts follow this convention)
#   0 — passed
#   1 — failed (artifact present but invalid)
#   2 — not ready (artifact missing; task not yet actionable)

# Status values: todo | in_progress | blocked | done | dropped
# IDs: DG0-S# (discovery gate), E#-S# (epic story), OD-### (open decision ref)
# blocked_by: IDs that must be done/closed first
# unblocks:   IDs this task unblocks (informational; enables reverse lookup)
sequence:
  - DG0
  - E1
  - [E2, E5] # in parallel once DG0-S3 / DG0-S4 close
  - [E3, E4] # in parallel
  - E6
