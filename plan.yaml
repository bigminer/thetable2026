      - Collections enumerated (existing + new) with rationale per collection
      - Per-collection field list with required/optional and type annotation
      - Block union design — closed set of typed blocks, with raw_html retained only as documented last-resort fallback
      - Reference relationships mapped (podcast→speakers, podcast→series, pages→events, staff→staff-group, etc.)
      - Cardinality decisions (e.g. podcast.speakers as array vs single reference) documented with reasoning
      - URL validation approach against route-classification.json specified
      - SEO schema additions specified (OG image, Twitter card, canonical override per OD-001, JSON-LD hooks for events/articles/podcast)
      - Media handling approach decided (string paths vs media collection with alt/dimensions/rights)
      - Proposal explicitly reviewed and approved before E2-S1 begins
    verify: scripts/verify/DG0-S6.sh
    budget:
      attempts: 5
      time_hours: 6
