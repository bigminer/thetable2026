services:
  - type: web
    name: thetabletx
    runtime: node
    # Production deploys from `release`, not `main`, so merging to main does not
    # ship. Promote by merging main into release.
    #
    # This must live here rather than in the dashboard: a Blueprint sync
    # reconciles the service against this file, and a branch set only in the
    # dashboard is reset to the Blueprint's own branch on the next sync.
    branch: release
    buildCommand: npm ci && npm run build
    startCommand: HOST=0.0.0.0 npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASK_LLM_BASE_URL
        sync: false
      - key: ASK_LLM_MODEL
        sync: false
      - key: ASK_LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Contact and newsletter form delivery via Google Workspace SMTP.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: PUBLIC_TURNSTILE_SITEKEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      # Turnstile reports the hostname the widget rendered on, and verification
      # rejects anything not listed here. The site is served from
      # thetabletx.onrender.com until the domain cutover, so both must be
      # allowed or every submission fails with 403. Drop the onrender host once
      # thetabletx.org serves production.
      - key: TURNSTILE_HOSTNAMES
        value: thetabletx.org,thetabletx.onrender.com
      # Optional analytics. GTM preferred; GA4 is the fallback when GTM is unset.
      - key: PUBLIC_GTM_ID
        sync: false
      - key: PUBLIC_GA4_ID
        sync: false
