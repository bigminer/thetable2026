name: Verify website

on:
  push:
    branches: [main, release, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch that gets several pushes in a row only needs its newest commit
# verified; supersede the runs still queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
