name: Deploy preview to GitHub Pages

# Visual QA only: manually publish a reviewed PR branch to the shared Pages URL.
# Production is Render. Publishing is deliberately not triggered by pushes to main.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number for this preview
        required: true
        type: number

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Set preview version
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be a number" >&2
            exit 1
          fi
          echo "PUBLIC_BUILD_VERSION=$(date -u +%Y.%m.%d).pr-${PR_NUMBER}" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # A static build cannot serve these. Forms still render; they just do not
      # submit, and /ask returns no answer.
      - name: Remove server-only routes
        run: rm -rf src/pages/api

      - name: Build static preview
        run: npm run build:gh-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
