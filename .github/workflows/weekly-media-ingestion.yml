name: Weekly media ingestion

on:
  schedule:
    - cron: "0 20 * * 0"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in dry-run mode
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run weekly media ingestion
        env:
          AUTOMATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'true' }}
        run: |
          if [ "$AUTOMATION_DRY_RUN" = "true" ]; then
            npm run automation:ingest-one-series -- --dry-run
          else
            npm run automation:ingest-one-series -- --write
          fi
