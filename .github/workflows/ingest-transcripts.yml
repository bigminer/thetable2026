name: Ingest sermon transcripts

# One-sermon pilot. Weekly backlog ingestion stays paused until milestone 3.
# No API credentials or paid transcription fallback are used by this workflow.
on:
  workflow_dispatch:
    inputs:
      prepared_source_commit:
        description: 'Optional full commit SHA containing locally acquired data/ask/self-blame.json'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ask-self-blame-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve an existing transcript review
        run: |
          if [ ! -f data/ask/self-blame.json ]; then
            existing=$(git ls-remote --heads origin refs/heads/ask/self-blame-review)
            if [ -n "$existing" ]; then
              git fetch origin refs/heads/ask/self-blame-review
              mkdir -p data/ask
              git show FETCH_HEAD:data/ask/self-blame.json > data/ask/self-blame.json
            fi
          fi
      - run: pipx install yt-dlp
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare optional YouTube authentication
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            umask 077
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
          fi
      - name: Acquire only the self-blame sermon
        if: inputs.prepared_source_commit == ''
        run: npm run ask:pilot -- ingest
      - name: Recover locally acquired bounded captions
        if: inputs.prepared_source_commit != ''
        env:
          SOURCE_COMMIT: ${{ inputs.prepared_source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Supply a full commit SHA'; exit 1; }
          git fetch origin "$SOURCE_COMMIT"
          git show "$SOURCE_COMMIT:data/ask/self-blame.json" > "$RUNNER_TEMP/ask-source.json"
          npm run ask:pilot -- import "$RUNNER_TEMP/ask-source.json"
      - name: Validate the review gate
        run: npm run ask:pilot -- check
      - name: Open transcript review PR
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.ref_name }}
          branch: ask/self-blame-review
          title: 'Ask The Table: review the self-blame transcript (depends on #55)'
          commit-message: 'Stage bounded self-blame transcript for human review'
          draft: true
          body: |
            This adds only the self-blame sermon transcript for the first Ask The Table
            pilot. It does not publish the sermon listing or enable live search.

            Review order: #57 regular listing, #55 search implementation, then this
            transcript PR. This PR targets the selected implementation branch
            (`${{ github.ref_name }}`), not main; its code dependency is #55.

            Gary Miner must review this PR before any merge. Anna Barnes separately
            approves the transcript wording, metadata, bounds and consent. After those
            reviews, the transcript can be incorporated into #55; Gary reviews the final
            combined implementation before it merges to main. No automatic merge.

            Review `data/ask/self-blame.json` against https://www.youtube.com/watch?v=u7Q-WVrNLfc
            starting at 21:20 and ending at 53:30.24. These bounds remain candidates.
            April 19 is the verified sermon date; reconcile any provisional April 20
            upload date in the source before approval and indexing.

            Check speaker, consent, date, bounds and caption accuracy. The source is
            pending and cannot be served or embedded until Anna explicitly approves
            the exact content hash. See docs/ask-pilot.md for review and indexing.

            This workflow makes no model API calls and does not update the legacy
            download archive. Missing captions fail the run and remain retryable.
          add-paths: data/ask/self-blame.json
      - name: Remove temporary cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/yt-cookies.txt"
