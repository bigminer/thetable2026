name: Ingest sermon transcripts

# Downloads new auto-captioned transcripts from The Table's YouTube channel,
# generates markdown stubs for any new downloads, and opens a PR for human
# review. Stubs carry null fields that must be filled in before merge.

on:
  schedule:
    # Mondays at 10:00 UTC — Sunday night / Monday morning in US.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pipx install yt-dlp

      - name: Install Deno (JS runtime for yt-dlp's n-challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write YouTube cookies for yt-dlp
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: printf '%s' "$YT_COOKIES" > /tmp/yt-cookies.txt

      - name: Download new transcripts
        # yt-dlp exits 101 when --break-on-existing stops the run — that's
        # expected (it just means we caught up to the archive), not failure.
        run: |
          set +e
          npm run fetch -- --cookies /tmp/yt-cookies.txt "${{ vars.YOUTUBE_CHANNEL_URL }}"
          code=$?
          if [ $code -eq 0 ] || [ $code -eq 101 ]; then exit 0; fi
          exit $code

      - name: Whisper fallback for videos without auto-captions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run transcribe

      - name: Generate stubs for new downloads
        run: npm run make-stubs

      - name: Enrich titles and detect series
        run: npm run enrich-titles

      - name: Auto-detect sermon bounds via Brett's consistent phrasings
        run: npm run detect-bounds

      - name: Generate AI descriptions for new stubs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run make-descriptions

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: transcripts/ingest
          delete-branch: true
          commit-message: "Ingest new sermon transcripts"
          title: "Review: new sermon transcripts"
          body: |
            Auto-ingested new sermon transcripts from YouTube.

            Most fields arrive filled in: this workflow runs title enrichment, series
            detection, sermon-bound detection and description generation before opening
            the PR. **Your job is to check the guesses and fill the gaps, not to type
            everything in.**

            **Check these in each stub under `data/transcripts/content/`:**

            - `title` — auto-filled from the YouTube title. Tidy it for display.
            - `content_start` / `content_end` — **format `"hh:mm:ss"`, quoted** (e.g. `"00:28:15"`).
              Auto-detected from Brett's "grace and peace" opener and the "open table"
              communion transition. Guest speakers and special services usually fail
              detection and arrive `null` — fill those in by watching the video.
            - `speaker` — defaults to `brett_tilford`. Use `guest:first-last` for a guest
              teacher.
            - `content_type` — defaults to `sermon`. One of: `sermon` | `table_talk` |
              `guest_sermon` | `worship` | `story_sunday` | `panel_discussion` | `announcements`
            - `series` — auto-detected where possible; `null` means not part of a series.
            - `content_description` — auto-generated summary. Read it for accuracy.

            **Two fields decide whether `/ask` can quote a talk.** The chatbot is
            default-deny: it skips anything that does not pass every check.

            - `consent_status` defaults to `granted`. Set it to anything else to keep a
              talk out of the chatbot while leaving the transcript in the repo.
            - `speaker` must be exactly `brett_tilford`. Marking a talk `guest:...`
              correctly excludes it — guest teachers have not consented to being quoted.

            A stub with `content_start` or `content_end` left `null`, or with the wrong
            time format, is skipped silently. It will not error; the talk simply never
            appears in `/ask`.

            Merge once each stub has been checked and no required field is `null`.
          labels: |
            transcripts
            needs-review
          add-paths: |
            data/transcripts/raw/
            data/transcripts/content/
            data/transcripts/archive.txt
